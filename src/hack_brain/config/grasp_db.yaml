# Grasp parameters: by_name overrides by_category overrides default. Owner: grasping.
# Heights in metres at the fingertips. The TCP is FINGERTIP (0.21 m) above them: grasp_planner.tcp_at.
# z_offset is added to the object's top_z (negative = below the top).
# align: short_axis = fingers close across the short side, long_axis = across the long side.
# Values are starting points, tune them per object in the simulator (milestone M2-M3).
# Slip is not a simulator bug (docs/ANALYSIS.md, section 8 item 10). Set `force` per object to 0.3-0.5
# (Hand.force -> /inspire_hand/set_force; 1.0 pushes the object out). Presets already aim slightly past
# the object. motion_node lowers /inspire_hand/set_speed on a close and rotates the thumb first.
# `force` 0 keeps the current limit (the default 1.0 until something sets it).

default: {approach: top, preset: power, z_offset: -0.03, pre_height: 0.10, lift_height: 0.15, align: short_axis}

by_category:
  box:         {preset: power, align: short_axis}
  dish:        {preset: pinch, z_offset: -0.01}   # up to FLAT_MAX_HEIGHT: leaned chord in grasp_planner; this offset is the upright fallback
  figure:      {preset: pinch}
  jar:         {preset: power}
  electronics: {preset: power}

by_name:
  # skip: true = brain leaves the object untouched (0) instead of risking a drop (-10). The 2026-11-09 bench
  # never got these into a tray; drop the flag only after repeated complete deliveries through brain.
  # pool 4 (team 049): figure
  Schleich_African_Black_Rhino: {skip: true}  # flat pinch: lifted, then slipped
  # Seen at 0.39 on seed 146 (0.093 x 0.084 x 0.130 against 0.085 x 0.073 x 0.131): the light bulbs box is the next
  # category, 1.9 cm further, so the name is right and brain's 0.6 left it on the table. 2 of 3 lifted into the tray.
  3D_Dollhouse_Sink: {min_confidence: 0.3}
  LADYBUG_BEAD: {skip: true}  # empty grasps; the leaned pinch slipped on the lift
  # pool 4: dish
  Threshold_Bamboo_Ceramic_Soap_Dish: {force: 0.4, skip: true}  # flat pinch does not hold at 0.4-1.0
  Cole_Hardware_Bowl_Scirocco_YellowBlue: {skip: true}  # flat pinch: slipped on the lift 3 of 3
  # Lifted cups: 2 of 7 into the tray in sort3 runs (2026-11-10), 0 of 3 with pick_one at force 0.7 (1.0: two empty
  # grasps). A lifted object out of a tray is -10 (SCORING.md), an untouched one 0: at under half it costs points.
  Ecoforms_Cup_B4_SAN: {skip: true}
  # pool 4: box
  Nescafe_Memento_Latte_Caramel_8_08_oz_23_g_packets_64_oz_184_g: {skip: true}  # 6.4 cm box: empty or slips
  # 3.1 cm across; the only box with room between the pads. The grasp is 8.9 cm below the top, so the tips need more air.
  # Force 0.7 against 0.4 on a carry to tray_center (pick_one --tray, 2026-11-10): 7 of 8 into the tray against 1 of 3.
  # The thumb presses the box into the index, which is pushed back past open: the grip is the force limit.
  Brother_Ink_Cartridge_Magenta_LC75M: {preset: pinch, force: 0.7, pre_height: 0.12}
  Philips_EcoVantage_43_W_Light_Bulbs_Natural_Light_2_pack: {skip: true}  # 6.4 cm box: slips on the lift
  # pool 6 (extra sort2): electronics
  Razer_Taipan_White_Ambidextrous_Gaming_Mouse: {}
  JBL_Charge_Speaker_portable_wireless_wired_Green: {}
  Crosley_Alarm_Clock_Vintage_Metal: {}
  # pool 6: box
  Nestle_Nips_Hard_Candy_Peanut_Butter: {}
  Nips_Hard_Candy_Rich_Creamy_Butter_Rum_4_oz_1133_g: {}
  009_gelatin_box: {}

place:
  approach_height: 0.20  # above the tray opening centre
  release_height: 0.10
  inset: 0.06       # drop point from the tray centre towards the robot: side trays are at the edge of the reach
  rim_margin: 0.06  # the drop point stays this far inside the tray footprint
